<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazee’s Portfolio - Frutiger Aero Edition</title>
  <style>
    @font-face {
      font-family: 'Kulachat Serif';
      src: local('Kulachat Serif SemiBold'), local('Times New Roman');
      font-weight: 600;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      /* Background replaced with skyflower.jpg */
      background-color: #3a8ee6;
      background-image: url('skyflower.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Kulachat Serif', 'Times New Roman', serif;
      position: relative;
      user-select: none;
    }

    /* Interactive Bubble Canvas Layer */
    #bubble-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #bubble-canvas:active {
      cursor: grabbing;
    }

    /* Full-screen responsive wrapper with a realistic book drop shadow behind it */
    .book-wrapper {
      width: 92vw;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 25px 45px rgba(0, 30, 70, 0.45));
    }

    #book {
      pointer-events: auto;
    }

    /* Page styling: #F7F7E9 background, #0100ff text, thicker type, center-aligned body text */
    .page {
      background-color: #F7F7E9 !important;
      color: #0100ff !important;
      padding: 45px 50px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(1, 0, 255, 0.08);
      font-weight: 600;
    }

    /* Realistic center binding shadow curvature on left and right pages */
    .page.--left {
      border-right: none;
      box-shadow: inset -22px 0 25px -12px rgba(0, 0, 0, 0.12);
    }

    .page.--right {
      border-left: none;
      box-shadow: inset 22px 0 25px -12px rgba(0, 0, 0, 0.12);
    }

    /* Cover / Title and Last Page Styling */
    .page.cover-page {
      background: linear-gradient(135deg, #F7F7E9 0%, #dedec4 100%);
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 3px double #0100ff;
    }

    .cover-page h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #0100ff;
      font-weight: 600;
    }

    .cover-page h3 {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 5px 0;
      color: #0100ff;
    }

    .cover-page p {
      font-size: 1.1rem;
      margin: 3px 0;
      color: #0100ff;
      font-weight: 600;
    }

    /* Cover image placeholder (2" x 1" proportion) */
    .cover-image-placeholder {
      width: 192px;
      height: 96px;
      border: 2px dashed #0100ff;
