<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazee’s Portfolio - Frutiger Aero Edition</title>
  <style>
    @font-face {
      font-family: 'Kulachat Serif';
      src: local('Kulachat Serif SemiBold'), local('Times New Roman');
      font-weight: 600;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      /* Background set to your skyflower.jpg image */
      background-color: #3a8ee6;
      background-image: url('skyflower.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Kulachat Serif', 'Times New Roman', serif;
      position: relative;
      user-select: none;
    }

    /* Interactive Bubble Canvas Layer */
    #bubble-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #bubble-canvas:active {
      cursor: grabbing;
    }

    /* Full-screen responsive wrapper with a realistic book drop shadow behind it */
    .book-wrapper {
      width: 92vw;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 25px 45px rgba(0, 30, 70, 0.45));
    }

    #book {
      pointer-events: auto;
    }

    /* Page styling: #F7F7E9 background, #0100ff text, thicker type, center-aligned body text */
    .page {
      background-color: #F7F7E9 !important;
      color: #0100ff !important;
      padding: 45px 50px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(1, 0, 255, 0.08);
      font-weight: 600;
    }

    /* Realistic center binding shadow curvature on left and right pages */
    .page.--left {
      border-right: none;
      box-shadow: inset -22px 0 25px -12px rgba(0, 0, 0, 0.12);
    }

    .page.--right {
      border-left: none;
      box-shadow: inset 22px 0 25px -12px rgba(0, 0, 0, 0.12);
    }

    /* Cover / Title and Last Page Styling */
    .page.cover-page {
      background: linear-gradient(135deg, #F7F7E9 0%, #dedec4 100%);
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 3px double #0100ff;
    }

    .cover-page h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #0100ff;
      font-weight: 600;
    }

    .cover-page h3 {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 5px 0;
      color: #0100ff;
    }

    .cover-page p {
      font-size: 1.1rem;
      margin: 3px 0;
      color: #0100ff;
      font-weight: 600;
    }

    /* Cover image placeholder (2" x 1" proportion) */
    .cover-image-placeholder {
      width: 192px;
      height: 96px;
      border: 2px dashed #0100ff;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px auto;
      font-size: 0.8rem;
      color: #0100ff;
      background: rgba(1, 0, 255, 0.03);
    }

    /* Middle Pages Layout */
    .page-header-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
      color: #0100ff;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Body text centered vertically and horizontally */
    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 0.98rem;
      line-height: 1.6;
      color: #0100ff;
      text-align: center;
      overflow-y: auto;
    }

    .page-content p {
      margin-bottom: 12px;
      color: #0100ff;
    }

    /* Image placeholder box on the top of the page: 2in x 1in proportion (192px x 96px) */
    .image-placeholder-top {
      width: 192px;
      height: 96px;
      border: 2px dashed #0100ff;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 15px auto;
      font-size: 0.8rem;
      color: #0100ff;
      background: rgba(1, 0, 255, 0.03);
    }

    /* Page number on bottom right in 9pt */
    .page-number {
      font-size: 9pt;
      color: #0100ff;
      text-align: right;
      margin-top: 5px;
      font-weight: 600;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }

    .toc-list li {
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #0100ff;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- Interactive Canvas Background -->
  <canvas id="bubble-canvas"></canvas>

  <!-- Flipbook Container -->
  <div class="book-wrapper">
    <div id="book">

      <!-- PAGE 1: Title Page (Cover with Image Support) -->
      <div class="page cover-page" data-density="hard">
        <h1>Jazee’s Portfolio</h1>
        <div class="cover-image-placeholder">Cover Image (2" x 1")</div>
        <h3>Jastin Dumuk</h3>
        <p>Graphic Design Student</p>
        <p>Art 10c</p>
      </div>

      <!-- PAGE 2: Table of Contents -->
      <div class="page" data-density
